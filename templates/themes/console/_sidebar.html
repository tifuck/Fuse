        <span class="chat-brand-caption">Workspace</span>
      </a>
      <button type="button" class="chat-history-collapse" data-history-toggle aria-label="Toggle chat history" aria-controls="chat-history" aria-expanded="true" title="Toggle chat history">
        <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.65"/><path d="M7.5 4v12" fill="none" stroke="currentColor" stroke-width="1.65"/></svg>
      </button>
    </div>
    <div class="chat-history-top" data-history-top>
      <div class="chat-history-bar">
        <div class="chat-history-tabs" role="tablist" aria-label="History">
          <button type="button" class="chat-history-tab" role="tab" aria-controls="chat-history-panel" data-history-tab="chats" aria-selected="true" aria-busy="false">
            Chats
            <span class="chat-run-spin" data-run-spin="chats" hidden aria-hidden="true"></span>
            <span class="chat-history-tab-unread" data-history-unread hidden></span>
          </button>
          <button type="button" class="chat-history-tab" role="tab" aria-controls="chat-history-panel" data-history-tab="projects" aria-selected="false" aria-busy="false">
            Projects
            <span class="chat-run-spin" data-run-spin="projects" hidden aria-hidden="true"></span>
            <span class="chat-history-tab-unread" data-history-unread hidden></span>
          </button>
        </div>
        <button type="button" class="chat-new" data-chat-new aria-label="New chat" title="New chat">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span class="visually-hidden" data-chat-new-label>New chat</span>
        </button>
        <button type="button" class="chat-history-iconbtn" data-history-search-toggle aria-expanded="false" aria-controls="chat-search" title="Search chats and projects">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="7" cy="7" r="4.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.4 10.4L13.8 13.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span class="visually-hidden">Search chats and projects</span>
        </button>
        <button type="button" class="chat-history-iconbtn chat-history-dock-toggle" data-history-toggle aria-label="Toggle chat history" aria-controls="chat-history" aria-expanded="true" title="Toggle chat history">
          <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.65"/><path d="M7.5 4v12" fill="none" stroke="currentColor" stroke-width="1.65"/></svg>
        </button>
      </div>
      <div class="chat-history-search" id="chat-search" data-history-row hidden>
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="4.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.4 10.4L13.8 13.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <label class="visually-hidden" for="chat-search-input">Search chats and projects</label>
        <input id="chat-search-input" data-history-search type="search" placeholder="Search chats and projects" autocomplete="off">
        <button type="button" class="chat-history-search-close" data-history-search-close aria-label="Close search">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="chat-history-filters" data-project-filters hidden>
        <label>
          <span class="visually-hidden">Sort project sessions</span>
          <select data-project-sort>
            <option value="recent">Recent</option>
            <option value="project">By project</option>
          </select>
        </label>
        <label>
          <span class="visually-hidden">Filter by project</span>
          <select data-project-filter>
            <option value="">All projects</option>
          </select>
        </label>
      </div>
    </div>
    <p class="chat-history-kicker" data-history-kicker hidden>Chats</p>
    <div class="chat-history-list" id="chat-history-panel" data-history-list><div class="chat-history-loading" data-history-loading role="img" aria-label="Loading chats"><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
    <div class="chat-history-footer" data-history-footer>
      <button type="button" class="chat-history-foot" data-history-archived aria-pressed="false" hidden>
        <svg class="chat-history-foot-back" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M9.5 3.8L5.3 8l4.2 4.2M5.6 8H13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="chat-history-foot-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="2.4" y="3" width="11.2" height="3" rx="0.8" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3.4 6v6.2a.8.8 0 0 0 .8.8h7.6a.8.8 0 0 0 .8-.8V6M6.5 8.6h3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span data-history-archived-label>Archived</span>
        <span class="chat-history-foot-count" data-history-archived-count></span>
      </button>
      {% include "_account.html" %}
    </div>
    <button type="button" class="chat-history-resize" data-history-resize role="separator" aria-orientation="vertical" aria-label="Resize sidebar" aria-controls="chat-history" aria-valuemin="224" aria-valuemax="480" aria-valuenow="304" title="Drag or use arrow keys to resize · double-click or Enter to reset"></button>
  </aside>
  <div class="chat-history-edge" data-history-edge aria-hidden="true"></div>
  <button type="button" class="chat-history-backdrop" data-history-backdrop aria-label="Close chat history" tabindex="-1" hidden></button>
