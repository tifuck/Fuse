{#- Combined theme: the phone quick dial. Every data-* hook here is a runtime contract; the other
    themes' partials carry the same set (tests/chat_theme_markup.test.cjs). -#}
<button type="button" class="fuse-dial-scrim" data-dial-scrim tabindex="-1" aria-hidden="true" hidden></button>
<div class="fuse-dial" data-fuse-dial hidden>
  <button type="button" class="fuse-dial-hub" data-dial-hub aria-haspopup="menu" aria-expanded="false" aria-controls="fuse-dial-fan" aria-label="Quick actions">
    <span class="fuse-dial-ticks" aria-hidden="true"></span>
    <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><circle cx="8" cy="8" r="1.7" fill="currentColor"/><path d="M8 1.8v2.6M8 11.6v2.6M1.8 8h2.6M11.6 8h2.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>
  <svg class="fuse-dial-spokes" data-dial-spokes aria-hidden="true"></svg>
  <div class="fuse-dial-fan" id="fuse-dial-fan" data-dial-fan role="menu" aria-label="Quick actions"></div>
</div>
