{#- Combined theme: a 40px header. The project chip, the title, one status
    pill (run state, elapsed time, agents; it toggles the rail) and labeled
    Context and Artifacts buttons. Every data-* hook but data-theme-* is a
    runtime contract (tests/chat_theme_markup.test.cjs). -#}
  <header class="chat-bar cb-head" data-chat-bar>
    <button type="button" class="cb-ib chat-history-toggle" data-history-toggle aria-label="Toggle chat history" aria-controls="chat-history" aria-expanded="true" title="Toggle chat history">
      <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7.5 4v12" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
    <div class="cb-chip" data-project-chip hidden>
      <span class="cb-chip-icon" data-project-icon aria-hidden="true"></span>
      <span data-project-name></span>
    </div>
    <h1 class="chat-bar-title cb-title"><span data-chat-title class="is-untitled"></span><span class="visually-hidden" data-chat-title-fallback>New chat</span></h1>
    <div class="cb-actions">
      <button type="button" class="cb-pill" data-theme-pill aria-pressed="false" aria-controls="cb-rail" title="Agents, background commands, todos and context">
        <i class="cb-pill-dot" aria-hidden="true"></i><span data-theme-pill-text>Ready</span><em data-theme-pill-meta></em>
      </button>
      <button type="button" class="cb-hb" data-memory-toggle aria-expanded="false" aria-controls="chat-context" aria-label="Context" title="Instructions and saved context">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M3.5 5h9v8.5h-9zM6 5V3.85a2 2 0 0 1 4 0V5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6.5 9.25h3M6.5 11.5h2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span>Context</span>
      </button>
      <button type="button" class="cb-hb" data-artifact-toggle aria-expanded="false" aria-controls="chat-artifact" aria-label="Artifacts" title="Artifacts (Ctrl+])">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="2.6" y="3.4" width="10.8" height="9.2" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5 9.2l1.7-2 1.5 1.7 2.2-2.7 2.2 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <span>Artifacts</span>
      </button>
      <button type="button" class="cb-ib chat-todo-toggle" data-todo-header hidden aria-expanded="false" aria-label="Todos" title="Show todos">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M2.8 4.2l1 1 1.7-1.9M2.8 8.2l1 1 1.7-1.9M2.8 12.2l1 1 1.7-1.9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.6 4.5h5.6M7.6 8.5h5.6M7.6 12.5h5.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <b class="cb-badge" data-todo-badge aria-hidden="true"></b>
      </button>
      <button type="button" class="cb-ib" data-skills-toggle aria-expanded="false" aria-controls="chat-skills" aria-label="Skills" title="Skills">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="2.6" y="2.6" width="10.8" height="10.8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M9.5 5.3L6.5 10.7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="cb-ib" data-notif-toggle aria-pressed="false" aria-label="Alerts" title="Notify me when a chat finishes on any device">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 2.4a3.6 3.6 0 0 0-3.6 3.6c0 2.8-1.1 3.9-1.6 4.4h10.4c-.5-.5-1.6-1.6-1.6-4.4A3.6 3.6 0 0 0 8 2.4z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M6.6 12.6a1.5 1.5 0 0 0 2.8 0" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
      <div class="cb-view" data-chat-view-picker>
        <button type="button" class="cb-ib" data-view-toggle aria-label="Appearance" aria-haspopup="dialog" aria-expanded="false" aria-controls="chat-view-menu" title="Appearance">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 2.4v11.2a5.6 5.6 0 0 0 0-11.2z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </header>
