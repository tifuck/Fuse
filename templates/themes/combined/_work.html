{#- Combined theme: the rail (agents, background commands, todos, context),
    the transcript and the subagent view with their live docks. Every data-*
    hook but data-theme-* is a runtime contract (tests/chat_theme_markup.test.cjs). -#}
  <aside class="cb-rail" id="cb-rail" data-theme-rail aria-label="Agents, background commands, todos and context">
    <section class="cb-work" data-work-strip hidden aria-label="Agents and background commands">
      <h4 class="cb-rail-h">Agents</h4>
      <div class="cb-agents" data-agents-list role="list" aria-label="Agents" hidden></div>
      <h4 class="cb-rail-h">Background</h4>
      <div class="cb-jobs" data-jobs-list role="list" aria-label="Background commands" hidden></div>
    </section>
    <section class="cb-rail-sec">
      <h4 class="cb-rail-h">Todos</h4>
      <div class="chat-live-todos" data-live-todos hidden role="region" aria-label="Todo list"></div>
    </section>
    <section class="cb-rail-sec" data-theme-context hidden>
      <h4 class="cb-rail-h">Context<span data-theme-context-pct></span></h4>
      <div class="cb-meter"><i data-theme-context-bar></i></div>
      <p class="cb-cap" data-theme-context-cap></p>
    </section>
  </aside>
  <div class="chat-thread" data-chat-thread role="region" aria-label="Conversation" tabindex="0">
    <div class="chat-log" data-chat-log hidden></div>
    <section class="chat-library" data-chat-library aria-label="Prompt library" hidden></section>
    <div class="chat-live-dock" data-live-dock hidden>
      <span class="chat-activity-spin" data-live-dock-spin aria-hidden="true"></span>
      <span class="chat-status-shimmer" data-dock-status><span data-live-dock-label><span class="chat-status-verb">Working</span><span class="chat-status-meta" hidden></span></span><span class="chat-dock-dots" aria-hidden="true"><i></i><i></i><i></i></span></span>
    </div>
  </div>
  <div class="chat-thread chat-agent-view" data-agent-view data-agent-log hidden role="region" aria-label="Subagent transcript" tabindex="0">
    <div class="chat-agent-error" data-agent-error role="alert" hidden>
      <p data-agent-error-text></p>
      <button type="button" class="chat-agent-view-tool" data-agent-retry>Retry</button>
    </div>
    <div class="chat-log chat-agent-log" data-agent-log-body></div>
    <div class="chat-live-dock chat-agent-live-dock" data-agent-live-dock hidden>
      <span class="chat-activity-spin" data-agent-live-spin aria-hidden="true"></span>
      <span class="chat-status-shimmer" data-dock-status><span data-agent-live-label><span class="chat-status-verb">Working</span><span class="chat-status-meta" hidden></span></span><span class="chat-dock-dots" aria-hidden="true"><i></i><i></i><i></i></span></span>
    </div>
  </div>
  <button type="button" class="chat-latest" data-chat-latest hidden><span class="chat-latest-arrow" aria-hidden="true">↓</span><span class="chat-activity-spin" data-chat-latest-spin aria-hidden="true"></span>Jump to latest</button>
