# One build for every Fuse server: the app asks for its server (connect.html).
# appId is a placeholder: scripts/dist.js sets FUSE_APP_ID or its default.
appId: com.example.fuse
productName: Fuse
copyright: Fuse

directories:
  output: dist
  buildResources: build

afterPack: scripts/after-pack.js

files:
  - main.js
  - site-preload.js
  - update-notice.js
  - context-menu.js
  - site-url.js
  - permissions.js
  - rendering.js
  - load-error.html
  - connect.html
  - package.json
  - build/icon.png
  - titlebar/**

# .github/workflows/desktop.yml publishes each version as release vX.Y.Z.
# File names carry no version, so /download links releases/latest/download/.
publish:
  provider: github
  owner: tifuck
  repo: Fuse

nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: Fuse-Setup.${ext}

dmg:
  writeUpdateInfo: true
  artifactName: Fuse.${ext}

# Files go in as root:root (fpm's default). --deb-use-file-permissions copied
# the builder's owner instead: CI's runner uid left /opt/Fuse/chrome-sandbox
# unowned by root and Chromium aborted on launch.
deb:
  afterInstall: build/after-install.sh
  artifactName: Fuse.${ext}

appImage:
  artifactName: Fuse.${ext}

linux:
  icon: build/icon.png
  category: Network
  # Native Wayland on Wayland sessions (X11 elsewhere). Under XWayland the
  # window loses the composer caret when tray apps like Handy update.
  executableArgs:
    - --ozone-platform-hint=auto
  target:
    - AppImage
    - deb

mac:
  icon: build/icon.png
  identity: null
  # The zip is what electron-updater reads on macOS, never the dmg.
  artifactName: Fuse-mac.${ext}
  # One build for Apple Silicon and Intel, as /download says.
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
