<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Fuse</title>
<style>
  html { color-scheme: dark; background: #141615; color: #e8e6e3; font: 16px/1.5 system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
  main { width: min(26rem, 100% - 4rem); padding: 2rem; }
  h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
  p { margin: 0 0 1rem; color: #a9a7a3; overflow-wrap: anywhere; }
  form { display: flex; gap: 0.5rem; margin: 0 0 1rem; }
  input { flex: 1; min-width: 0; font: inherit; min-height: 44px; padding: 0 0.75rem; border: 1px solid #3a3d3b; border-radius: 6px; background: #1b1d1c; color: inherit; }
  button { font: inherit; min-height: 44px; padding: 0.5rem 1.25rem; border: 1px solid #3a3d3b; border-radius: 6px; background: #232624; color: inherit; cursor: pointer; }
  input:focus-visible, button:focus-visible { outline: 2px solid #8ab4f8; outline-offset: 2px; }
  #error:not(:empty) { color: #f28b82; }
</style>
</head>
<body>
<main>
  <h1>Connect to Fuse</h1>
  <p>The address of your Fuse server.</p>
  <form data-desktop-connect>
    <input id="server" name="server" type="text" inputmode="url" placeholder="fuse.example.com" aria-label="Server address" spellcheck="false" autocomplete="url" required autofocus>
    <button type="submit">Connect</button>
  </form>
  <p id="status" aria-live="polite"></p>
  <p id="error" role="alert"></p>
</main>
<script>
  // main.js shows this page until a server is picked, and again from Change
  // server; site-preload.js sends the form to main, which checks the server.
  const q = new URLSearchParams(location.search);
  document.getElementById("server").value = q.get("url") || "";
  document.getElementById("error").textContent = q.get("error") || "";
  document.querySelector("form").addEventListener("submit", () => {
    document.querySelector("button").disabled = true;
    document.getElementById("error").textContent = "";
    document.getElementById("status").textContent = "Connecting…";
  });
</script>
</body>
</html>
