<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap">
<link rel="stylesheet" href="titlebar.css">
</head>
<body>
  <div class="bar">
    <div class="brand">
      <svg class="mark" viewBox="12 12 76 76" aria-hidden="true"><path d="M38.95 40.77A12 12 0 0 0 38.95 59.23A14 14 0 0 1 40.77 61.05A12 12 0 0 0 59.23 61.05A14 14 0 1 1 59.23 78.95A12 12 0 0 0 40.77 78.95A14 14 0 1 1 21.05 59.23A12 12 0 0 0 21.05 40.77A14 14 0 1 1 38.95 40.77Z"/><circle cx="70" cy="30" r="14"/></svg>

    </div>

      <button id="minimize" title="Minimize" aria-label="Minimize">
        <svg viewBox="0 0 10 10"><path d="M1 5.5h8"/></svg>
      </button>
      <button id="maximize" title="Maximize" aria-label="Maximize">

        <svg class="restore" viewBox="0 0 10 10"><rect x="1.5" y="3" width="5.5" height="5.5"/><path d="M3 3V1.5h5.5V7H7"/></svg>

      </button>
    </div>
  </div>
  <script src="titlebar.js"></script>
